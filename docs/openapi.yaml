openapi: 3.0.3
info:
  title: Appointment Management Communication API
  version: 1.0.0
  description: Authenticated direct messaging for the Salud Activa application.
servers:
  - url: http://localhost:3004
    description: Local service
paths:
  /api/messages:
    get:
      operationId: listConversationMessages
      summary: List a direct conversation
      security:
        - bearerAuth: []
      parameters:
        - name: withUser
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: before
          in: query
          description: Opaque cursor returned by the previous page.
          schema:
            type: string
      responses:
        '200':
          description: Conversation messages ordered from oldest to newest
          content:
            application/json:
              schema:
                type: object
                required: [messages, nextBefore]
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  nextBefore:
                    type: string
                    format: date-time
                    nullable: true
        '400':
          description: Missing or invalid conversation parameters
        '401':
          description: Bearer token is required
        '403':
          description: Bearer token is invalid or expired
        '503':
          description: Message store is unavailable
    post:
      operationId: sendMessage
      summary: Send a direct message
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toUserId, content]
              properties:
                toUserId:
                  type: string
                content:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    $ref: '#/components/schemas/Message'
        '400':
          description: Invalid message payload
        '401':
          description: Bearer token is required
        '403':
          description: Bearer token is invalid or expired
        '503':
          description: Message store is unavailable
  /api/messages/{id}/read:
    patch:
      operationId: markMessageRead
      summary: Mark a received message as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Message marked as read
        '401':
          description: Bearer token is required
        '403':
          description: Bearer token is invalid or expired
        '404':
          description: Message does not exist or is not addressed to this user
        '503':
          description: Message store is unavailable
components:
  schemas:
    Message:
      type: object
      required: [id, senderId, recipientId, content, createdAt, readAt]
      properties:
        id:
          type: string
        senderId:
          type: string
        recipientId:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
