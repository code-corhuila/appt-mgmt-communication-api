services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - communication_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  communication-api:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3004
      MONGODB_URI: mongodb://mongodb:27017/SaludActiva_communication
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to the same value as the auth service}
      NODE_ENV: production
    ports:
      - "${COMMUNICATION_PORT:-3004}:3004"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  communication_mongodb_data:
